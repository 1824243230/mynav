risk_map:
  risk_enable: true

  # d_safe = 1.2 * robot_width = 0.6 m
  # distance risk at d_safe ≈ 1.5
  lambda_distance: 1.0

  # safe corridor width = 2 * robot_width = 1.0 m
  # corridor risk at w_safe ≈ 2.0
  lambda_corridor: 0.5

  # unknown-region additional penalty
  lambda_unknown: 0.5

  robot_width: 0.5


risk_aware_graph:

  # Length and risk use candidate maxima; gamma weights raw dimensionless AVC.

  alpha: 1.0
  beta: 0.40
  gamma: 0.50
  # AVC-inspired feasibility penalty uses these positive vehicle values.
  nominal_speed: 1.0
  min_turn_radius: 1.0

  edge_sample_resolution: 0.1
  # Fine sampling defaults to the previous edge_sample_resolution value.
  fine_resolution: 0.1
  coarse_resolution: 1.0
  top_k_path: 10
  # Candidate-set maximum normalization; also protects zero maxima.
  normalization_epsilon: 1.0e-9
  # CVaR uses the highest-risk 10% of samples on each edge.
  risk_cvar_ratio: 0.1
  risk_cvar_weight: 1.0
  # Effectively disabled by default; set a finite operating limit as needed.
  risk_threshold: 1.0e+100
  # Same scale as the selector's high-risk boundary below.
  risk_safe_threshold: 150.0


risk_aware_path_selector:

  # TCBS is opt-in; disabled preserves the legacy path selector.
  enable_tcbs: false
  eta_switch: 0.15
  switch_threshold: 0.1
  lambda_switch: 0.1

  # normalized score:
  # length : risk = 1 : 2
  w1: 1.0
  w2: 1.5

  # Theoretical high-risk boundary
  high_risk_threshold: 15.0

  # 4 * robot_width
  open_space_width_threshold: 2.0
  # moderate adaptive weighting
  dynamic_weight_gain: 0.2

  orientation_tie_threshold: 0.03

  sample_resolution: 0.1


path_reliability:
  enable: true

  # Final ranking
  lambda_length: 2.0
  lambda_risk: 1.0
  lambda_prs: 0.5

  # exp(-alpha * 5) ≈ 0.5
  alpha: 0.14

  # assuming clearance_risk normalized to [0,1]
  beta: 0.69

  # assuming risk_variance critical value ≈ 4
  gamma: 0.17

  epsilon: 0.001

  sample_resolution: 0.1

  debug_output: true

# 可选 TRG-inspired 持久图管理；关闭时保持原有候选选择和 FSM 周期重规划行为。
trg_management:
  enable: false
  local_update_radius: 4.0
  expand_radius: 1.0
  merge_radius: 0.35
  connect_radius: 2.0
  node_risk_threshold: 150.0
  edge_risk_threshold: 150.0
  risk_change_threshold: 0.25
  switch_ratio: 0.15
  update_period: 0.5
  expansion_directions: 8
  max_frontiers_per_update: 4
  max_new_nodes_per_update: 8
  max_global_nodes: 3000
